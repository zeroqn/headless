name: Build Niri and upload release assets

on:
  push:
    branches: [main]
    paths-ignore:
      - release-assets.json
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: niri-headless-main-build
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build Niri
        run: nix build .#releaseBuild --out-link result --print-build-logs

      - name: Package build output
        run: |
          set -euo pipefail
          archive="niri-headless-main-x86_64-linux.tar.gz"
          tar -czf "$archive" -C "$(readlink -f result)" .
          sha256sum "$archive" >"$archive.sha256"

      - name: Attest release archive
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: niri-headless-main-x86_64-linux.tar.gz

      - name: Prepare attestation release asset
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" \
            niri-headless-main-x86_64-linux.tar.gz.sigstore.json

      - name: Update rolling release tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -fa main-build -m 'Rolling release for main branch'
          git push origin refs/tags/main-build --force

      - name: Reset rolling release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: "main-build",
              });
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-build
          name: Main branch build
          prerelease: true
          files: |
            niri-headless-main-x86_64-linux.tar.gz
            niri-headless-main-x86_64-linux.tar.gz.sha256
            niri-headless-main-x86_64-linux.tar.gz.sigstore.json

      - name: Update release metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          nix run .#update-release-assets
          git add release-assets.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update prebuilt release metadata"
          git push origin HEAD:main

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: niri-headless-x86_64-linux
          path: |
            niri-headless-main-x86_64-linux.tar.gz
            niri-headless-main-x86_64-linux.tar.gz.sha256
            niri-headless-main-x86_64-linux.tar.gz.sigstore.json
