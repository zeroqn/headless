name: Build and publish Headless release assets

on:
  push:
    branches: [main]
    paths-ignore:
      - release-assets.json
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-niri-rio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build Niri
        run: nix build .#releaseBuild --out-link result-niri --print-build-logs

      - name: Build Rio
        run: nix build .#rioReleaseBuild --out-link result-rio --print-build-logs

      - name: Package Niri and Rio
        run: |
          set -euo pipefail

          niri_archive="niri-headless-main-x86_64-linux.tar.gz"
          tar -czf "$niri_archive" -C "$(readlink -f result-niri)" .
          sha256sum "$niri_archive" >"$niri_archive.sha256"

          rio_archive="rio-d656326-x86_64-linux.tar.gz"
          tar -czf "$rio_archive" -C "$(readlink -f result-rio)" .
          sha256sum "$rio_archive" >"$rio_archive.sha256"

          test -x result-rio/bin/rio
          test -e result-rio/share/terminfo/r/rio
          test -e result-rio/share/terminfo/x/xterm-rio
          test -f result-rio/share/applications/rio.desktop
          test -f result-rio/share/icons/hicolor/scalable/apps/rio.svg
          test -f result-rio/share/man/man1/rio.1
          test -f result-rio/share/man/man5/rio.5
          test -f result-rio/share/man/man5/rio-bindings.5

      - name: Attest Niri and Rio archives
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: |
            niri-headless-main-x86_64-linux.tar.gz
            rio-d656326-x86_64-linux.tar.gz

      - name: Prepare Niri and Rio attestation asset
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" \
            niri-rio-main-build-x86_64-linux.sigstore.json

      - name: Upload Niri and Rio publication inputs
        uses: actions/upload-artifact@v4
        with:
          name: publish-niri-rio
          path: |
            niri-headless-main-x86_64-linux.tar.gz
            niri-headless-main-x86_64-linux.tar.gz.sha256
            rio-d656326-x86_64-linux.tar.gz
            rio-d656326-x86_64-linux.tar.gz.sha256
            niri-rio-main-build-x86_64-linux.sigstore.json

  build-sunshine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build Sunshine packages
        run: |
          nix build .#sunshineReleaseBuild \
            --out-link result-sunshine \
            --print-build-logs
          nix build .#sunshineReleaseBuildCuda \
            --out-link result-sunshine-cuda \
            --print-build-logs

      - name: Package Sunshine outputs
        run: |
          set -euo pipefail

          sunshine_archive="sunshine-main-x86_64-linux.tar.gz"
          tar -czf "$sunshine_archive" -C "$(readlink -f result-sunshine)" .
          sha256sum "$sunshine_archive" >"$sunshine_archive.sha256"

          cuda_archive="sunshine-main-cuda-x86_64-linux.tar.gz"
          tar -czf "$cuda_archive" -C "$(readlink -f result-sunshine-cuda)" .
          sha256sum "$cuda_archive" >"$cuda_archive.sha256"

          for result in result-sunshine result-sunshine-cuda; do
            test -x "$result/bin/sunshine"
            test -d "$result/assets"
            test -f "$result/share/applications/dev.lizardbyte.app.Sunshine.desktop"
            test -f "$result/share/systemd/user/app-dev.lizardbyte.app.Sunshine.service"
            test -f "$result/lib/udev/rules.d/60-sunshine.rules"
            test -f "$result/lib/modules-load.d/60-sunshine.conf"
          done

      - name: Attest Sunshine archives
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: |
            sunshine-main-x86_64-linux.tar.gz
            sunshine-main-cuda-x86_64-linux.tar.gz

      - name: Prepare Sunshine attestation asset
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" \
            sunshine-main-build-x86_64-linux.sigstore.json

      - name: Upload Sunshine publication inputs
        uses: actions/upload-artifact@v4
        with:
          name: publish-sunshine
          path: |
            sunshine-main-x86_64-linux.tar.gz
            sunshine-main-x86_64-linux.tar.gz.sha256
            sunshine-main-cuda-x86_64-linux.tar.gz
            sunshine-main-cuda-x86_64-linux.tar.gz.sha256
            sunshine-main-build-x86_64-linux.sigstore.json

  publish:
    needs:
      - build-niri-rio
      - build-sunshine
    if: always() && (needs.build-niri-rio.result == 'success' || needs.build-sunshine.result == 'success')
    runs-on: ubuntu-latest
    concurrency:
      group: headless-main-build-publisher
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Download Niri and Rio publication inputs
        if: needs.build-niri-rio.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: publish-niri-rio
          path: publish

      - name: Download Sunshine publication inputs
        if: needs.build-sunshine.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: publish-sunshine
          path: publish

      - name: Select published package groups
        env:
          NIRI_RIO_RESULT: ${{ needs.build-niri-rio.result }}
          SUNSHINE_RESULT: ${{ needs.build-sunshine.result }}
        run: |
          set -euo pipefail
          groups=()
          if [[ "$NIRI_RIO_RESULT" == success ]]; then
            groups+=(niri-rio)
          fi
          if [[ "$SUNSHINE_RESULT" == success ]]; then
            groups+=(sunshine)
          fi
          IFS=,
          echo "PUBLISH_GROUPS=${groups[*]}" >>"$GITHUB_ENV"

      - name: Confirm workflow commit is current main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Update rolling release tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -fa main-build -m 'Rolling release for main branch'
          git push origin refs/tags/main-build --force

      - name: Upload successful release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-build
          name: Main branch build
          prerelease: true
          overwrite_files: true
          files: publish/*

      - name: Update release metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          nix run .#update-release-assets
          git add release-assets.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update prebuilt release metadata"
          git push origin HEAD:main

      - name: Upload combined workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: headless-x86_64-linux
          path: publish/*
