# Sunshine configuration: 4K60 over LAN, VA-API encoder.
#
# Install as ~/.config/sunshine/sunshine.conf (or point the service at it) and add your own
# `apps_file`/`file_state`/`log_path` if you keep them elsewhere.
#
# Why these values at 4K60, and how to verify them on your machine:
#   ./diagnose-stream-quality.sh            # 4K60 sample: FEC blocks per frame, latency, UDP rate
#   ./diagnose-serverinfo.sh                # is the host answering Moonlight's poll
# A frame is packed into at most 4 FEC blocks (2 header bits), so a frame larger than
# 4 * (255*100/(100+fec_percentage)) * (packetsize+12) bytes is sent with NO FEC at all and a
# single lost packet costs the whole frame. At the values below that ceiling is:
#   packetsize 1024 @ 20%  ->  ~878 KB      packetsize 1456 @ 20%  ->  ~1.24 MB
# Raise packetsize (<=1456, or <=your-MTU-44 on a VPN) or lower fec_percentage if you see
# "Skipping FEC for abnormally large encoded frame" in the log: it means keyframes/rate-control
# spikes are exceeding that ceiling, which is a host-side bitrate problem, not packet loss.

# --- VA-API encoder -------------------------------------------------------------------------
encoder = vaapi

# Quality profile: auto / speed / balanced / quality (maps to the driver's quality range).
# `balanced` keeps 4K60 inside the frame budget; `quality` costs GPU time.
vaapi_quality = balanced

# Rate control: auto / avbr / cbr / cqp / icq / qvbr / vbr.
# VBR avoids filler data on bitrate undershoot and keeps quality on scene changes.
vaapi_rc = vbr

# Force a single-frame VBV with that VBR. This is what keeps a keyframe or a scene change from
# producing an enormous frame, which is the usual cause of "Skipping FEC for abnormally large
# encoded frame" at 4K60. Quality during fast motion drops slightly in exchange.
vaapi_strict_rc_buffer = enabled

# Block-level bitrate control: driver-dependent, leave unset unless you know your driver wants it.
#vaapi_blbrc = enabled

# Capture: wlr = wlroots screencopy (Wayland compositor), kms = DRM/KMS (needs CAP_SYS_ADMIN).
# wlr is the safe default; kms is lower latency if your compositor lets Sunshine take the
# output directly.
capture = wlr

# 4K60 needs HEVC (or AV1): H.264 at 4K60 is bitrate-starved at any sane bitrate.
# 0 = advertise whatever the encoder supports, 2 = HEVC Main, 3 = HEVC Main + Main10 (HDR).
hevc_mode = 3

# AV1 gives ~30% better quality per bit at 4K but costs more GPU time to encode.
# 1 = do not advertise, 2 = AV1 Main, 3 = AV1 Main + 10-bit.
av1_mode = 1

# Stream pacing.
packetsize = 1024
fec_percentage = 20

# 0 = always use the bitrate Moonlight asks for. Set a cap (Kbps) if you share the link.
max_bitrate = 0

# Only stream the audio/video you want; microphone routing adds a virtual sink swap per session.
stream_audio = enabled
stream_mic = enabled
